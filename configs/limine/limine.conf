timeout: 5
# !!! THEME TEMPLATE ONLY — the entries below the entry marker in this file are
# !!! stale snapshots of auto-generated content. NEVER cp this whole file
# !!! over /boot/limine.conf — deploy only the theme block above the first
# !!! the entry marker marker (handoff-post-reboot.sh does this automatically).
default_entry: 2
remember_last_entry: yes

# ============================================================
# SYNTHWAVE '84 — deep purple #240037, hot pink #FF7EDB,
# electric purple #8F00FF, magenta #FF00FF, yellow #F3E70F, cyan #03EDF9
# ============================================================
graphics: yes
wallpaper: boot():/limine-splash.png
wallpaper_style: stretched
term_margin: 64
term_margin_gradient: 64
term_font_scale: 2x2
term_font_spacing: 1
term_palette: 240037;FE4450;72F1B8;F3E70F;8F00FF;FF00FF;03EDF9;FF7EDB
term_palette_bright: 495495;FE4450;72F1B8;FEDE5D;B084EB;FF7EDB;03EDF9;FFFFFF
term_background: 240037
term_foreground: 03EDF9
term_background_bright: FF7EDB
term_foreground_bright: 240037
interface_branding: ==[ SYNTHWAVE '84 // THIS IS THE WAVE ]==
interface_branding_colour: FFFFFF
interface_help_colour: B084EB
interface_help_colour_bright: F3E70F

# Boot entries are NOT stored here. They are machine-specific
# (root UUID, machine-id, initramfs hashes) and a stale copy panics boot.
# handoff-post-reboot.sh splices this header onto the live entries.
