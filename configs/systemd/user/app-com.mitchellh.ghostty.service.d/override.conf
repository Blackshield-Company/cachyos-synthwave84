# Override for ghostty 1.3.1-arch2.1 on systemd >= 259:
# shipped unit uses Type=notify-reload + ReloadSignal=SIGUSR2, but the binary
# registers no USR2 handler, so systemd refuses startup ("lacks handler for
# reload signal USR2") and KDE launches (DBusActivatable=true) die silently.
[Service]
Type=notify
ReloadSignal=
